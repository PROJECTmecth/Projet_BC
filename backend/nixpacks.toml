# Nixpacks configuration for Laravel on Railway
[variables]
    NIXPACKS_PHP_ROOT_DIR = "/app/public"
    APP_ENV = "production"

[phases.build]
    cmds = [
        "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader"
    ]

[start]
    cmd = "cp .env.railway .env || true; php artisan config:clear || true; php artisan cache:clear || true; php artisan route:clear || true; node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
