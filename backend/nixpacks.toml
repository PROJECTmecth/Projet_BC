# Nixpacks configuration for Laravel on Railway
[variables]
    NIXPACKS_PHP_ROOT_DIR = "/app/public"
    APP_ENV = "production"

[phases.build]
    cmds = [
        "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader"
    ]

[start]
    cmd = "cp .env.railway .env && php artisan config:clear && php artisan cache:clear && php artisan route:clear && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
