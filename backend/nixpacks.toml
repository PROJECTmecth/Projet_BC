# ═══════════════════════════════════════════════════════════════
# Nixpacks Configuration — Laravel on Railway (Production)
# ═══════════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ["php83", "nginx", "libmysqlclient", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.bcmath", "php83Extensions.openssl", "php83Extensions.fileinfo", "php83Extensions.curl"]

[phases.install]
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "composer install --no-dev --optimize-autoloader --no-interaction"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
